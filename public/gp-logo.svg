<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="GP logo - rounded square" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow effect -->
  <rect x="6" y="6" width="244" height="244" rx="62" ry="62" fill="url(#glowGradient)" opacity="0.5"/>
  
  <!-- Main rounded rectangle -->
  <rect x="12" y="12" width="232" height="232" rx="56" ry="56" fill="none" stroke="url(#borderGradient)" stroke-width="12"/>
  
  <!-- Inner highlight -->
  <rect x="18" y="18" width="220" height="220" rx="50" ry="50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- GP Text -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Poppins, Montserrat, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, Arial, sans-serif"
        font-weight="800" font-size="120" fill="url(#textGradient)" letter-spacing="-6">
    GP
  </text>
  
  <!-- Text shadow/glow -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Poppins, Montserrat, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, Arial, sans-serif"
        font-weight="800" font-size="120" fill="rgba(255,255,255,0.1)" letter-spacing="-6" 
        transform="translate(2,2)">
    GP
  </text>
</svg>
