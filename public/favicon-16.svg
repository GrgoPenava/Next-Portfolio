<svg width="16" height="16" viewBox="0 0 256 256" role="img" aria-label="GP logo - 16x16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main rounded rectangle -->
  <rect x="1" y="1" width="14" height="14" rx="3" ry="3" fill="none" stroke="url(#borderGradient16)" stroke-width="1"/>
  
  <!-- GP Text -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Poppins, Montserrat, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, Arial, sans-serif"
        font-weight="800" font-size="8" fill="url(#textGradient16)" letter-spacing="-0.5">
    GP
  </text>
</svg>
