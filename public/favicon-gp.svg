<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="GP favicon" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="none" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- GP Text -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Poppins, Inter, system-ui, Arial, sans-serif"
        font-weight="800" font-size="14" fill="url(#textGradient)" letter-spacing="-1">
    GP
  </text>
</svg>
